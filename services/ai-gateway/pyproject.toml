[project]
name = "polis-ai-gateway"
version = "0.1.0"
description = "Polis Interface AI gateway — grounded RAG assistant, traces, review gate."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "polis-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polis_aigateway"]
