services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: polis
      POSTGRES_DB: polis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polis -d polis']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - polis

  governance-graph-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: governance-graph-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8100:8100'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8100/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  audit-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: audit-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8600:8600'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8600/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: platform-api
    depends_on:
      postgres:
        condition: service_healthy
      governance-graph-api:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      # Internal service URLs for the §23 proxy (compose service hostnames).
      GRAPH_INTERNAL_URL: http://governance-graph-api:8100
      AUDIT_INTERNAL_URL: http://audit-service:8600
      GIT_SHA: ${GIT_SHA:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/basicalex/polis}
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

networks:
  polis:
    driver: bridge

volumes:
  pgdata:
