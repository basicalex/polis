    image: alpine/socat:1.8.0.3
    profiles: [debug]
    command: ['tcp-listen:8100,fork,reuseaddr', 'tcp-connect:governance-graph-api:8100']
    ports: ['8100:8100']
    networks: [polis]

  audit-service-debug:
