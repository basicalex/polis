services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: polis
      POSTGRES_DB: polis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polis -d polis']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - polis

  governance-graph-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: governance-graph-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8100:8100'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8100/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  audit-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: audit-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8600:8600'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8600/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  polis-bridge-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: polis-bridge-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      POLIS_MODE: stub
    ports:
      - '8200:8200'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8200/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  paperless-adapter:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: paperless-adapter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PAPERLESS_MODE: ${PAPERLESS_MODE:-stub}
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL:-http://paperless:8000}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-polis-paperless-dev-token}
    ports:
      - '8300:8300'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8300/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  canonicalization-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: canonicalization-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8500:8500'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8500/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  signature-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: signature-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      SIGNATURE_MODE: ${SIGNATURE_MODE:-stub}
    ports:
      - '8900:8900'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8900/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  timestamp-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: timestamp-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      TIMESTAMP_MODE: ${TIMESTAMP_MODE:-stub}
      TSA_URL: ${TSA_URL:-http://tsa:3000/api/v1/timestamp}
      TSA_CERTCHAIN_URL: ${TSA_CERTCHAIN_URL:-http://tsa:3000/api/v1/timestamp/certchain}
    ports:
      - '8800:8800'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8800/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  proof-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: proof-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      signature-service:
        condition: service_healthy
      timestamp-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      SIGNATURE_INTERNAL_URL: http://signature-service:8900
      TIMESTAMP_INTERNAL_URL: http://timestamp-service:8800
    ports:
      - '8700:8700'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8700/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  document-ingestion-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: document-ingestion-gateway
    depends_on:
      paperless-adapter:
        condition: service_healthy
      canonicalization-service:
        condition: service_healthy
      proof-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PAPERLESS_INTERNAL_URL: http://paperless-adapter:8300
      CANONICALIZATION_INTERNAL_URL: http://canonicalization-service:8500
      PROOF_INTERNAL_URL: http://proof-service:8700
      AUDIT_INTERNAL_URL: http://audit-service:8600
    ports:
      - '8400:8400'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8400/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  contribution-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: contribution-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      REWARDS_INTERNAL_URL: http://rewards-service:8460
    ports:
      - '8450:8450'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8450/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  rewards-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: rewards-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
    ports:
      - '8460:8460'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8460/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  citizen-identity-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: citizen-identity-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      IDENTITY_DEV_TOKENS: 'true'
      IDENTITY_MODE: ${IDENTITY_MODE:-stub}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/polis}
      OIDC_AUTHORIZATION_ISSUER: ${OIDC_AUTHORIZATION_ISSUER:-http://localhost:8081/realms/polis}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-polis-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-polis-web-dev-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:4321/login/callback}
    ports:
      - '8650:8650'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8650/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  citizen-vault-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: citizen-vault-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      citizen-identity-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
    ports:
      - '8750:8750'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8750/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  vc-issuer-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: vc-issuer-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
    ports:
      - '8950:8950'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8950/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: platform-api
    depends_on:
      postgres:
        condition: service_healthy
      governance-graph-api:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      polis-bridge-service:
        condition: service_healthy
      proof-service:
        condition: service_healthy
      contribution-service:
        condition: service_healthy
      rewards-service:
        condition: service_healthy
      citizen-identity-service:
        condition: service_healthy
      citizen-vault-service:
        condition: service_healthy
      vc-issuer-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      # Internal service URLs for the §23 proxy (compose service hostnames).
      GRAPH_INTERNAL_URL: http://governance-graph-api:8100
      AUDIT_INTERNAL_URL: http://audit-service:8600
      POLIS_INTERNAL_URL: http://polis-bridge-service:8200
      PROOF_INTERNAL_URL: http://proof-service:8700
      AI_INTERNAL_URL: http://ai-gateway:8550
      CONTRIBUTION_INTERNAL_URL: http://contribution-service:8450
      REWARDS_INTERNAL_URL: http://rewards-service:8460
      IDENTITY_INTERNAL_URL: http://citizen-identity-service:8650
      VAULT_INTERNAL_URL: http://citizen-vault-service:8750
      VC_ISSUER_INTERNAL_URL: http://vc-issuer-service:8950
      BUILD_TIME: ${BUILD_TIME:-}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/basicalex/polis}
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  ai-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/ai-gateway.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      AUDIT_INTERNAL_URL: http://audit-service:8600
      POLICY_REGO_PATH: /app/policy/ai.rego
      PORT: '8550'
      AI_MODE: ${AI_MODE:-stub}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-stub}
    ports:
      - '8550:8550'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8550/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - polis

  # M10 OIDC identity provider (self-hosted Keycloak). Default IDENTITY_MODE is
  # stub, so a bare `docker compose up` never depends on Keycloak; flipped on
  # with IDENTITY_MODE=oidc. Dev H2 (start-dev) + idempotent init-realm.sh on
  # each boot — reproducible; production uses a real Keycloak DB (operator env).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # Stable issuer (--hostname as a full URL, strict defaults true): the realm
    # issuer is fixed to http://localhost:8081 so the browser authorize, the
    # token `iss` claim, and server-side userinfo validation all agree — even
    # though the service reaches Keycloak via the internal `keycloak:8080` URL.
    command:
      [
        'start-dev',
        '--import-realm',
        '--http-port',
        '8080',
        '--hostname',
        'http://localhost:8081',
        '--health-enabled=true',
      ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - '8081:8080'
    networks:
      - polis

  # One-shot realm/client/user provisioning. The official image has no curl, so
  # there is no docker healthcheck on `keycloak`; init-realm.sh loops kcadm until
  # Keycloak answers (depends_on: service_started, not service_healthy).
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ['/bin/bash', '/etc/keycloak/init-realm.sh']
    volumes:
      - ../../infra/keycloak/init-realm.sh:/etc/keycloak/init-realm.sh:ro
    environment:
      KC_SERVER: http://keycloak:8080
      KC_ADMIN: admin
      KC_ADMIN_PASSWORD: admin
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-polis-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-polis-web-dev-secret}
    restart: 'no'
    networks:
      - polis

  # M11 Paperless-ngx document node (self-hosted). Default PAPERLESS_MODE is
  # stub, so a bare `docker compose up` never depends on Paperless; flipped on
  # with PAPERLESS_MODE=http. The adapter reaches Paperless at request time
  # (no depends_on on paperless-adapter — mirrors M10's keycloak rule).
  paperless-redis:
    image: redis:7
    networks:
      - polis

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14
    depends_on:
      paperless-redis:
        condition: service_started
    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-polis-paperless-dev-secret}
      PAPERLESS_URL: http://localhost:8001
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_MAIL: admin@polis.local
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin}
      # Poll the consume inbox instead of inotify — healthier in a compose mount.
      PAPERLESS_CONSUMER_POLLING: '1'
      PAPERLESS_OCR_LANGUAGE: eng
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
    ports:
      - '8001:8000'
    networks:
      - polis

  # One-shot deterministic dev API token. The image has no curl/healthcheck on
  # `paperless`; init-token.sh loops a urllib readiness then upserts the same
  # POLIS_PAPERLESS_DEV_TOKEN the adapter reads (depends_on: service_started).
  paperless-init:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14
    depends_on:
      paperless:
        condition: service_started
    entrypoint: ['/bin/bash', '/infra/paperless/init-token.sh']
    volumes:
      - paperless-data:/usr/src/paperless/data
      - ../../infra/paperless/init-token.sh:/infra/paperless/init-token.sh:ro
    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-polis-paperless-dev-secret}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin}
      POLIS_PAPERLESS_DEV_TOKEN: ${PAPERLESS_API_TOKEN:-polis-paperless-dev-token}
    restart: 'no'
    networks:
      - polis

  # M12 RFC 3161 timestamp authority (self-hosted sigstore/timestamp-authority).
  # Default TIMESTAMP_MODE is stub, so a bare `docker compose up` never depends
  # on the TSA; flipped on with TIMESTAMP_MODE=real. Built from the pinned
  # upstream release (no published image — binaries-only); boots with an
  # in-memory signing key/cert regenerated each start (explicitly NOT
  # production). The adapter reaches it at request time (no depends_on on
  # timestamp-service — mirrors M10/M11 rule). certReq=true embeds the TSA cert
  # in each token so validation is self-contained without persisting the chain.
  tsa:
    build:
      context: https://github.com/sigstore/timestamp-authority.git#v2.1.2
      dockerfile: Dockerfile
      target: deploy
    command:
      ['timestamp-server', 'serve', '--host=0.0.0.0', '--port=3000', '--timestamp-signer=memory']
    ports:
      - '3002:3000'
    networks:
      - polis

networks:
  polis:
    driver: bridge

volumes:
  pgdata:
  paperless-data:
  paperless-media:
