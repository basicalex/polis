services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: polis
      POSTGRES_DB: polis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polis -d polis']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - polis

  governance-graph-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: governance-graph-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8100:8100'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8100/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  audit-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: audit-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8600:8600'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8600/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  polis-bridge-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: polis-bridge-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      POLIS_MODE: stub
    ports:
      - '8200:8200'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8200/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  paperless-adapter:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: paperless-adapter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PAPERLESS_MODE: stub
    ports:
      - '8300:8300'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8300/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  canonicalization-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: canonicalization-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
    ports:
      - '8500:8500'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8500/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  signature-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: signature-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      SIGNATURE_MODE: stub
    ports:
      - '8900:8900'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8900/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  timestamp-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: timestamp-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      TIMESTAMP_MODE: stub
    ports:
      - '8800:8800'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8800/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  proof-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: proof-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      signature-service:
        condition: service_healthy
      timestamp-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      SIGNATURE_INTERNAL_URL: http://signature-service:8900
      TIMESTAMP_INTERNAL_URL: http://timestamp-service:8800
    ports:
      - '8700:8700'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8700/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  document-ingestion-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: document-ingestion-gateway
    depends_on:
      paperless-adapter:
        condition: service_healthy
      canonicalization-service:
        condition: service_healthy
      proof-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PAPERLESS_INTERNAL_URL: http://paperless-adapter:8300
      CANONICALIZATION_INTERNAL_URL: http://canonicalization-service:8500
      PROOF_INTERNAL_URL: http://proof-service:8700
    ports:
      - '8400:8400'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8400/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: platform-api
    depends_on:
      postgres:
        condition: service_healthy
      governance-graph-api:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      polis-bridge-service:
        condition: service_healthy
      proof-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      # Internal service URLs for the §23 proxy (compose service hostnames).
      GRAPH_INTERNAL_URL: http://governance-graph-api:8100
      AUDIT_INTERNAL_URL: http://audit-service:8600
      POLIS_INTERNAL_URL: http://polis-bridge-service:8200
      PROOF_INTERNAL_URL: http://proof-service:8700
      GIT_SHA: ${GIT_SHA:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/basicalex/polis}
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

networks:
  polis:
    driver: bridge

volumes:
  pgdata:
