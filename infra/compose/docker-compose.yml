services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: polis
      POSTGRES_DB: polis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polis -d polis']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - polis

  governance-graph-api:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: governance-graph-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-polis-internal-dev-token}
    expose:
      - '8100'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8100/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  audit-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: audit-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-polis-internal-dev-token}
    expose:
      - '8600'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8600/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

  polis-bridge-service:
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args:
        SERVICE: polis-bridge-service
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://polis:polis@postgres:5432/polis
      NODE_ENV: production
      AUDIT_INTERNAL_URL: http://audit-service:8600
      POLIS_MODE: stub
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-polis-internal-dev-token}
    expose:
      - '8200'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8200/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - polis

