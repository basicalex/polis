[project]
name = "polis-core"
version = "0.1.0"
description = "Polis Interface core domain models and primitives shared by Python services."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polis_core"]
