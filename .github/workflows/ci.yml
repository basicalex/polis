name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: build · lint · test (ts + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install OPA (policy-as-code)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.17.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync Python workspace
        run: uv sync
      - name: Lint (eslint + prettier)
        run: bun run lint
      - name: Verify (build · typecheck · test · v1:smoke)
        run: bun run verify
      - name: Python ruff
        run: uv run ruff check .
      - name: Python pytest
        run: uv run pytest

  security:
    name: dependency + secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency scan (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.0
        with:
          scan-args: |-
            --lockfile=bun.lock
            --lockfile=uv.lock
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
